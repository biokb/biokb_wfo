[project]
name = "biokb_wfo"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Christian Ebeling", email = "Christian.Ebeling@scai.fraunhofer.de"},
]
dependencies = [
    "cryptography>=46.0.3",
    "fastapi[standard]>=0.128.0",
    "jellyfish>=1.2.1",
    "levenshtein>=0.27.3",
    "pandas>=2.3.3",
    "pymysql>=1.1.2",
    "sqlalchemy>=2.0.45",
    "tqdm>=4.67.1",
]
requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
docs = [
    "eralchemy[graphviz]>=1.6.0",
]



